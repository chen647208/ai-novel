<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.6 system-ui, sans-serif; margin: 0; padding: 8px; }
    </style>
  </head>
  <body>
    <button id="apply">请求宿主执行编辑器操作</button>
    <script>
      window.parent.postMessage({ type: 'ready' }, '*');
      document.getElementById('apply').addEventListener('click', function () {
        window.parent.postMessage(
          { type: 'request', payload: { ops: [{ kind: 'replaceSelection', text: '来自插件的内容' }] } },
          '*'
        );
      });
    </script>
  </body>
</html>
