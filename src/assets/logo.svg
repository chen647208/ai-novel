<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="红月创作">
  <defs>
    <radialGradient id="hy-moon" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#ff8a9b"/>
      <stop offset="42%" stop-color="#e11d48"/>
      <stop offset="82%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#6b1026"/>
    </radialGradient>
    <radialGradient id="hy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#e11d48" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hy-enso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c98b" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#e8b06a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c98a4a" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="hy-moon-clip">
      <circle cx="128" cy="128" r="70"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#hy-glow)"/>

  <!-- 墨环（enso）留缺口，寓意"未完成的创作" -->
  <path d="M128 18a110 110 0 1 1-77.8 32.2" fill="none" stroke="url(#hy-enso)"
        stroke-width="7" stroke-linecap="round"/>

  <!-- 红月 -->
  <circle cx="128" cy="128" r="70" fill="url(#hy-moon)"/>
  <g clip-path="url(#hy-moon-clip)">
    <!-- 暗部：弦月阴影 -->
    <circle cx="158" cy="116" r="68" fill="#5c0d1f" opacity="0.35"/>
    <!-- 高光 -->
    <ellipse cx="104" cy="100" rx="18" ry="12" fill="#ffffff" opacity="0.28" transform="rotate(-24 104 100)"/>
  </g>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#ffd9df" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
