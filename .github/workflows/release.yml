name: Release

# 仅在推送形如 v1.2.3 的标签时触发：先由人工确认稳定版本并打 tag，
# 工作流再构建 Windows / macOS / Linux 三端桌面包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            builder: --win
          - os: macos-latest
            label: macOS
            builder: --mac
          - os: ubuntu-latest
            label: Linux
            builder: --linux
    env:
      # 开源默认不做代码签名/公证，避免 CI 因找不到证书而失败
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与测试（含覆盖率锁线，与 CI 一致）
        run: npm run typecheck:all && npm run test:coverage

      - name: 构建桌面包（${{ matrix.label }}）
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 收集产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.label }}
          path: |
            build/release/*.exe
            build/release/*.dmg
            build/release/*.AppImage
            build/release/*.deb
            build/release/*.blockmap
            build/release/latest*.yml
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 红月创作 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: false
