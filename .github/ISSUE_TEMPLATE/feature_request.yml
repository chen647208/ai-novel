name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 功能广度优先走插件生态；请先说明能否以插件实现。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: dropdown
    id: pluginable
    attributes:
      label: 能否由插件实现
      options:
        - 不确定
        - 可以（资源型：技能/类型/构建档）
        - 需要新扩展点
        - 属于核心能力
    validations:
      required: true
